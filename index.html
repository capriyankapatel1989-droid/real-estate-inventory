<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="app"></div>
    <script>
        class App {
            constructor() {
                this.userRole = null;
                this.activeTab = 'dashboard';
                this.inventory = JSON.parse(localStorage.getItem('inv') || '[]');
                this.filters = { dev: '', loc: '', priceMin: '', priceMax: '', type: '', status: '', beds: '', furn: '' };
                this.showComm = false;
                this.render();
            }
            login(pwd) {
                if (pwd === 'admin123') { this.userRole = 'admin'; this.showComm = true; }
                else if (pwd === 'team123') { this.userRole = 'team'; this.showComm = false; }
                else { alert('Wrong password'); return; }
                this.render();
            }
            logout() { this.userRole = null; this.render(); }
            save() { localStorage.setItem('inv', JSON.stringify(this.inventory)); }
            async upload(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const b64 = e.target.result.split(',')[1];
                    try {
                        const res = await fetch('/api/extract', {
                            method: 'POST',
                            body: JSON.stringify({ base64Data: b64, mimeType: file.type })
                            body: JSON.stringify({
                                model: 'claude-opus-4-6',
                                max_tokens: 4096,
                                messages: [{
                                    role: 'user',
                                    content: [
                                        { type: 'text', text: 'Extract property data from file. Return JSON array with fields: developer, project, location, status, handoverTimeline, paymentPlan, unitType, postHandoverOptions, availability, bedrooms, lowestPrice, highestPrice, lowestArea, highestArea, pricePerSqft, lastUpdate, furnished, nonFurnished, commission. Return ONLY the JSON array, nothing else.' },
                                        { type: 'document', source: { type: 'base64', media_type: file.type, data: b64 } }
                                    ]
                                }]
                            })
                        });
                        const data = await res.json();
                        if (data.error) { alert('Error: ' + data.error.message); return; }
                        const text = data.content[0]?.text || '';
                        const json = JSON.parse(text.replace(/```json|```/g, '').trim());
                        const units = Array.isArray(json) ? json : [json];
                        this.inventory.push(...units);
                        this.save();
                        this.render();
                        alert('✓ Extracted ' + units.length + ' units!');
                    } catch(err) { alert('Error: ' + err.message); }
                };
                reader.readAsDataURL(file);
            }
            filter() {
                return this.inventory.filter(u => {
                    if (this.filters.dev && !u.developer?.toLowerCase().includes(this.filters.dev.toLowerCase())) return false;
                    if (this.filters.loc && !u.location?.toLowerCase().includes(this.filters.loc.toLowerCase())) return false;
                    if (this.filters.priceMin && u.lowestPrice < parseInt(this.filters.priceMin)) return false;
                    if (this.filters.priceMax && u.highestPrice > parseInt(this.filters.priceMax)) return false;
                    if (this.filters.type && !u.unitType?.toLowerCase().includes(this.filters.type.toLowerCase())) return false;
                    if (this.filters.status && !u.status?.toLowerCase().includes(this.filters.status.toLowerCase())) return false;
                    if (this.filters.beds && !u.bedrooms?.includes(this.filters.beds)) return false;
                    return true;
                });
            }
            download() {
                const filtered = this.filter();
                const headers = ['Developer', 'Project', 'Location', 'Status', 'Type', 'Bedrooms', 'Price', 'Area', 'Avail'];
                if (this.showComm) headers.push('Commission');
                const rows = filtered.map(u => [
                    u.developer, u.project, u.location, u.status, u.unitType, u.bedrooms,
                    u.lowestPrice + '-' + u.highestPrice, u.lowestArea + '-' + u.highestArea,
                    u.availability ? 'Yes' : 'No', this.showComm ? (u.commission * 100) : ''
                ]);
                const csv = [headers, ...rows].map(r => r.map(c => '"' + c + '"').join(',')).join('\n');
                const a = document.createElement('a');
                a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
                a.download = 'inventory.csv';
                a.click();
            }
            render() {
                const app = document.getElementById('app');
                if (!this.userRole) {
                    app.innerHTML = `
                        <div class="min-h-screen bg-blue-600 flex items-center justify-center">
                            <div class="bg-white p-8 rounded-lg shadow-lg w-96">
                                <h1 class="text-3xl font-bold text-center mb-2">Real Estate Inventory</h1>
                                <p class="text-center text-gray-600 mb-8">UAE Developer Inventory System</p>
                                <div class="mb-6">
                                    <p class="font-semibold mb-3">Login as:</p>
                                    <label class="flex items-center mb-3">
                                        <input type="radio" name="r" value="admin" id="r1" class="mr-2"> Admin (Full Access)
                                    </label>
                                    <label class="flex items-center mb-4">
                                        <input type="radio" name="r" value="team" id="r2" class="mr-2"> Team Member
                                    </label>
                                </div>
                                <button onclick="window.app.login(document.querySelector('input[name=r]:checked').value === 'admin' ? 'admin123' : 'team123')" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Login</button>
                                <p class="text-center text-gray-600 text-sm mt-6">
                                    <strong>Admin:</strong> admin123<br/><strong>Team:</strong> team123
                                </p>
                            </div>
                        </div>
                    `;
                } else {
                    const filtered = this.filter();
                    app.innerHTML = `
                        <div class="min-h-screen bg-gray-100">
                            <header class="bg-blue-600 text-white p-4">
                                <div class="max-w-7xl mx-auto flex justify-between">
                                    <h1 class="text-2xl font-bold">Real Estate Inventory</h1>
                                    <div class="flex gap-3">
                                        ${this.userRole === 'admin' ? `<button onclick="window.app.showComm=!window.app.showComm; window.app.render()" class="bg-blue-700 px-3 py-2 rounded">${this.showComm ? '👁️ Hide' : '🚫 Show'} Commission</button>` : ''}
                                        <button onclick="window.app.logout()" class="bg-red-500 px-3 py-2 rounded">Logout</button>
                                    </div>
                                </div>
                            </header>
                            <div class="bg-white border-b">
                                <div class="max-w-7xl mx-auto flex">
                                    <button onclick="window.app.activeTab='upload'; window.app.render()" class="px-6 py-3 border-b-2 ${this.activeTab === 'upload' ? 'border-blue-600 text-blue-600' : 'border-transparent'}">📤 Upload</button>
                                    <button onclick="window.app.activeTab='dashboard'; window.app.render()" class="px-6 py-3 border-b-2 ${this.activeTab === 'dashboard' ? 'border-blue-600 text-blue-600' : 'border-transparent'}">📊 Dashboard (${filtered.length})</button>
                                </div>
                            </div>
                            <main class="max-w-7xl mx-auto p-6">
                                ${this.activeTab === 'upload' ? `
                                    <div class="bg-white p-6 rounded-lg shadow">
                                        <h2 class="text-xl font-bold mb-4">📥 Upload Developer File</h2>
                                        <div class="border-2 border-dashed p-8 text-center rounded-lg bg-gray-50">
                                            <p class="font-semibold mb-3">Select Excel, PDF, or Image file</p>
                                            <input type="file" id="fileInput" accept=".xlsx,.pdf,.jpg,.png,.jpeg" class="block mx-auto mb-4">
                                            <button onclick="const f = document.getElementById('fileInput'); if(f.files[0]) window.app.upload(f.files[0]); else alert('Choose file first')" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Upload & Extract</button>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="space-y-6">
                                        <div class="bg-white p-6 rounded-lg shadow">
                                            <h2 class="text-xl font-bold mb-4">🔍 Filter Results</h2>
                                            <div class="grid grid-cols-3 gap-4">
                                                <input type="text" id="f1" placeholder="Developer" value="${this.filters.dev}" onchange="window.app.filters.dev = this.value; window.app.render();" class="border rounded px-3 py-2">
                                                <input type="text" id="f2" placeholder="Location" value="${this.filters.loc}" onchange="window.app.filters.loc = this.value; window.app.render();" class="border rounded px-3 py-2">
                                                <input type="number" id="f3" placeholder="Min Price" value="${this.filters.priceMin}" onchange="window.app.filters.priceMin = this.value; window.app.render();" class="border rounded px-3 py-2">
                                                <input type="number" id="f4" placeholder="Max Price" value="${this.filters.priceMax}" onchange="window.app.filters.priceMax = this.value; window.app.render();" class="border rounded px-3 py-2">
                                                <select id="f5" onchange="window.app.filters.status = this.value; window.app.render();" class="border rounded px-3 py-2">
                                                    <option value="">All Status</option>
                                                    <option value="Ready">Ready</option>
                                                    <option value="Under Construction">Under Construction</option>
                                                </select>
                                                <button onclick="window.app.download()" class="bg-green-600 text-white rounded hover:bg-green-700">⬇️ Download CSV</button>
                                            </div>
                                        </div>
                                        <div class="bg-white rounded-lg shadow overflow-x-auto">
                                            <table class="w-full text-sm">
                                                <thead class="bg-gray-100"><tr>
                                                    <th class="px-4 py-2 text-left">Developer</th>
                                                    <th class="px-4 py-2 text-left">Project</th>
                                                    <th class="px-4 py-2 text-left">Location</th>
                                                    <th class="px-4 py-2 text-left">Type</th>
                                                    <th class="px-4 py-2 text-left">Price Range</th>
                                                    <th class="px-4 py-2 text-left">Status</th>
                                                    <th class="px-4 py-2 text-left">Avail</th>
                                                    ${this.showComm ? '<th class="px-4 py-2 text-left">Commission</th>' : ''}
                                                </tr></thead>
                                                <tbody>
                                                    ${filtered.length ? filtered.map(u => `<tr class="border-b">
                                                        <td class="px-4 py-2">${u.developer || '-'}</td>
                                                        <td class="px-4 py-2">${u.project || '-'}</td>
                                                        <td class="px-4 py-2">${u.location || '-'}</td>
                                                        <td class="px-4 py-2">${u.unitType || '-'}</td>
                                                        <td class="px-4 py-2">${u.lowestPrice ? (u.lowestPrice/1e6).toFixed(2) + 'M' : '-'}</td>
                                                        <td class="px-4 py-2"><span class="px-2 py-1 rounded text-xs bg-green-100">${u.status || '-'}</span></td>
                                                        <td class="px-4 py-2">${u.availability ? '✓' : '✗'}</td>
                                                        ${this.showComm ? `<td class="px-4 py-2">${(u.commission || 0) * 100}%</td>` : ''}
                                                    </tr>`).join('') : '<tr><td colspan="8" class="px-4 py-4 text-center text-gray-500">No data. Upload files to start.</td></tr>'}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                `}
                            </main>
                        </div>
                    `;
                }
            }
        }
        window.app = new App();
    </script>
</body>
</html>
