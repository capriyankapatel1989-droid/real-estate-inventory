<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="app"></div>
    <script>
        class App {
            constructor() {
                this.userRole = null;
                this.tab = 'dashboard';
                this.data = JSON.parse(localStorage.getItem('data') || '[]');
                this.filters = {};
                this.showComm = false;
                this.msg = '';
                this.loading = false;
                this.render();
            }

            login(pwd) {
                if (pwd === 'admin123') { this.userRole = 'admin'; this.showComm = true; this.msg = ''; }
                else if (pwd === 'team123') { this.userRole = 'team'; this.showComm = false; this.msg = ''; }
                else { this.msg = 'Wrong password'; }
                this.render();
            }

            logout() { this.userRole = null; this.msg = ''; this.render(); }

            save() { localStorage.setItem('data', JSON.stringify(this.data)); }

            async upload(file) {
                if (!file) return;
                this.loading = true;
                this.msg = 'Processing...';
                this.render();

                try {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const b64 = e.target.result.split(',')[1];
                        this.msg = 'Extracting data...';
                        this.render();

                        const res = await fetch('/api/extract', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ base64Data: b64, mimeType: file.type })
                        });

                        const json = await res.json();
                        
                        if (!res.ok || json.error) {
                            this.msg = 'Error: ' + (json.error || 'Unknown');
                            this.loading = false;
                            this.render();
                            return;
                        }

                        try {
                            const textContent = json.content.find(c => c.type === 'text').text;
                            const cleanJson = textContent.replace(/```json|```/g, '').trim();
                            const units = JSON.parse(cleanJson);
                            const arr = Array.isArray(units) ? units : [units];
                            
                            this.data = [...this.data, ...arr];
                            this.save();
                            this.msg = '✓ Extracted ' + arr.length + ' units';
                        } catch (e) {
                            this.msg = 'Parse error: ' + e.message;
                        }
                        
                        this.loading = false;
                        this.render();
                    };
                    reader.readAsDataURL(file);
                } catch (error) {
                    this.msg = 'Error: ' + error.message;
                    this.loading = false;
                    this.render();
                }
            }

            filter() {
                return this.data.filter(u => {
                    if (this.filters.dev && !u.developer?.toLowerCase().includes(this.filters.dev.toLowerCase())) return false;
                    if (this.filters.loc && !u.location?.toLowerCase().includes(this.filters.loc.toLowerCase())) return false;
                    if (this.filters.status && u.status !== this.filters.status) return false;
                    return true;
                });
            }

            download() {
                const filtered = this.filter();
                const headers = ['Developer', 'Project', 'Location', 'Status', 'Type', 'Avail'];
                if (this.showComm) headers.push('Commission');
                
                const rows = filtered.map(u => [
                    u.developer || '', u.project || '', u.location || '', u.status || '', u.unitType || '',
                    u.availability ? 'Yes' : 'No', this.showComm ? (u.commission * 100) : ''
                ]);

                const csv = [headers, ...rows].map(r => r.map(c => '"' + c + '"').join(',')).join('\n');
                const a = document.createElement('a');
                a.href = 'data:text/csv,' + encodeURIComponent(csv);
                a.download = 'inventory.csv';
                a.click();
            }

            render() {
                const app = document.getElementById('app');
                
                if (!this.userRole) {
                    app.innerHTML = `
                        <div class="min-h-screen bg-blue-600 flex items-center justify-center p-4">
                            <div class="bg-white p-8 rounded-lg shadow-lg w-96">
                                <h1 class="text-3xl font-bold text-center mb-2">Real Estate Inventory</h1>
                                <p class="text-center text-gray-600 mb-8">UAE Developer System</p>
                                ${this.msg ? `<div class="mb-4 p-3 bg-red-100 text-red-700 rounded text-sm">${this.msg}</div>` : ''}
                                <div class="mb-6">
                                    <label class="flex items-center mb-3"><input type="radio" name="role" value="admin" class="mr-2"> Admin</label>
                                    <label class="flex items-center"><input type="radio" name="role" value="team" class="mr-2"> Team</label>
                                </div>
                                <button onclick="window.app.login(document.querySelector('input[name=role]:checked').value === 'admin' ? 'admin123' : 'team123')" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Login</button>
                                <p class="text-center text-sm text-gray-600 mt-4">Admin: admin123 | Team: team123</p>
                            </div>
                        </div>
                    `;
                } else {
                    const filtered = this.filter();
                    app.innerHTML = `
                        <div class="min-h-screen bg-gray-100">
                            <header class="bg-blue-600 text-white p-4">
                                <div class="flex justify-between items-center max-w-7xl mx-auto">
                                    <h1 class="text-2xl font-bold">Real Estate Inventory</h1>
                                    <div class="flex gap-2">
                                        ${this.userRole === 'admin' ? `<button onclick="window.app.showComm=!window.app.showComm; window.app.render()" class="bg-blue-700 px-3 py-1 rounded text-sm">${this.showComm ? '👁' : '🚫'} Commission</button>` : ''}
                                        <button onclick="window.app.logout()" class="bg-red-500 px-3 py-1 rounded text-sm">Logout</button>
                                    </div>
                                </div>
                            </header>
                            <div class="bg-white border-b">
                                <div class="max-w-7xl mx-auto flex">
                                    <button onclick="window.app.tab='upload'; window.app.render()" class="px-6 py-3 border-b-2 ${this.tab === 'upload' ? 'border-blue-600' : 'border-transparent'}">📤 Upload</button>
                                    <button onclick="window.app.tab='dashboard'; window.app.render()" class="px-6 py-3 border-b-2 ${this.tab === 'dashboard' ? 'border-blue-600' : 'border-transparent'}">📊 Dashboard (${filtered.length})</button>
                                </div>
                            </div>
                            <main class="max-w-7xl mx-auto p-6">
                                ${this.tab === 'upload' ? `
                                    <div class="bg-white p-6 rounded-lg shadow">
                                        <h2 class="text-xl font-bold mb-4">📥 Upload File</h2>
                                        ${this.msg ? `<div class="mb-4 p-3 rounded ${this.msg.includes('✓') ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} text-sm">${this.msg}</div>` : ''}
                                        <div class="border-2 border-dashed p-8 text-center rounded-lg">
                                            <p class="font-semibold mb-3">Select Excel, PDF, or Image</p>
                                            <input type="file" id="f" accept=".xlsx,.pdf,.jpg,.png" class="mb-4">
                                            <button onclick="window.app.upload(document.getElementById('f').files[0])" ${this.loading ? 'disabled' : ''} class="bg-blue-600 text-white px-6 py-2 rounded disabled:bg-gray-400">${this.loading ? 'Processing...' : 'Upload'}</button>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="space-y-4">
                                        <div class="bg-white p-4 rounded-lg shadow">
                                            <div class="grid grid-cols-3 gap-2 mb-4">
                                                <input type="text" placeholder="Developer" onchange="window.app.filters.dev = this.value; window.app.render();" class="border rounded px-3 py-2 text-sm">
                                                <input type="text" placeholder="Location" onchange="window.app.filters.loc = this.value; window.app.render();" class="border rounded px-3 py-2 text-sm">
                                                <select onchange="window.app.filters.status = this.value; window.app.render();" class="border rounded px-3 py-2 text-sm">
                                                    <option value="">All Status</option>
                                                    <option value="Ready">Ready</option>
                                                    <option value="Under Construction">Under Construction</option>
                                                </select>
                                            </div>
                                            <button onclick="window.app.download()" class="bg-green-600 text-white px-4 py-2 rounded text-sm">⬇ Download CSV</button>
                                        </div>
                                        ${filtered.length ? `
                                            <div class="bg-white rounded-lg shadow overflow-x-auto">
                                                <table class="w-full text-xs">
                                                    <thead class="bg-gray-200"><tr>
                                                        <th class="px-2 py-2 text-left">Developer</th>
                                                        <th class="px-2 py-2 text-left">Project</th>
                                                        <th class="px-2 py-2 text-left">Location</th>
                                                        <th class="px-2 py-2 text-left">Status</th>
                                                        <th class="px-2 py-2 text-left">Type</th>
                                                        <th class="px-2 py-2 text-left">Avail</th>
                                                        ${this.showComm ? '<th class="px-2 py-2 text-left">Commission</th>' : ''}
                                                    </tr></thead>
                                                    <tbody>
                                                        ${filtered.map(u => `<tr class="border-b"><td class="px-2 py-2">${u.developer}</td><td class="px-2 py-2">${u.project}</td><td class="px-2 py-2">${u.location}</td><td class="px-2 py-2">${u.status}</td><td class="px-2 py-2">${u.unitType}</td><td class="px-2 py-2">${u.availability ? '✓' : '✗'}</td>${this.showComm ? `<td class="px-2 py-2">${(u.commission || 0) * 100}%</td>` : ''}</tr>`).join('')}
                                                    </tbody>
                                                </table>
                                            </div>
                                        ` : '<div class="bg-white p-8 text-center text-gray-500 rounded">No data yet</div>'}
                                    </div>
                                `}
                            </main>
                        </div>
                    `;
                }
            }
        }
        window.app = new App();
    </script>
</body>
</html>
