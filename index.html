<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="app"></div>
    <script>
        class RealEstateApp {
            constructor() {
                this.state = {
                    userRole: null,
                    activeTab: 'dashboard',
                    inventory: [],
                    filteredInventory: [],
                    password: '',
                    showCommission: false,
                    message: '',
                    uploading: false,
                    filters: { developer: '', location: '', priceMin: '', priceMax: '', unitType: '', status: '', bedrooms: '', furnished: '' }
                };
                this.loadInventory();
                this.render();
            }
            loadInventory() {
                const saved = localStorage.getItem('inventoryData');
                if (saved) this.state.inventory = JSON.parse(saved), this.applyFilters();
            }
            saveInventory() {
                localStorage.setItem('inventoryData', JSON.stringify(this.state.inventory));
            }
            handleLogin(password) {
                this.state.userRole = password === 'admin123' ? 'admin' : password === 'team123' ? 'team' : null;
                this.state.showCommission = this.state.userRole === 'admin';
                this.state.message = this.state.userRole ? '' : 'Invalid password';
                this.render();
            }
            handleLogout() {
                this.state.userRole = null;
                this.state.password = '';
                this.render();
            }
            async handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                this.state.uploading = true;
                this.state.message = 'Processing file...';
                this.render();
                try {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const base64Data = e.target.result.split(',')[1];
                        this.state.message = 'Extracting data with AI...';
                        this.render();
                        const response = await fetch('https://api.anthropic.com/v1/messages', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                model: 'claude-opus-4-6',
                                max_tokens: 4096,
                                messages: [{
                                    role: 'user',
                                    content: [{
                                        type: 'text',
                                        text: 'Extract property data: {"developer":"","project":"","location":"","status":"","handoverTimeline":"","paymentPlan":"","unitType":"","postHandoverOptions":false,"availability":false,"bedrooms":"","lowestPrice":0,"highestPrice":0,"lowestArea":0,"highestArea":0,"pricePerSqft":0,"lastUpdate":"","furnished":false,"nonFurnished":false,"commission":0}. Return ONLY JSON array.'
                                    }, {
                                        type: 'document',
                                        source: { type: 'base64', media_type: file.type, data: base64Data }
                                    }]
                                }]
                            })
                        });
                        const data = await response.json();
                        if (data.error) { this.state.message = `Error: ${data.error.message}`; this.state.uploading = false; this.render(); return; }
                        const textContent = data.content.find(b => b.type === 'text')?.text || '';
                        const jsonStr = textContent.replace(/```json|```/g, '').trim();
                        const extractedData = JSON.parse(jsonStr);
                        const newUnits = Array.isArray(extractedData) ? extractedData : [extractedData];
                        this.state.inventory = [...this.state.inventory, ...newUnits];
                        this.saveInventory();
                        this.applyFilters();
                        this.state.message = `✓ Extracted ${newUnits.length} units`;
                        this.state.uploading = false;
                        this.render();
                    };
                    reader.readAsDataURL(file);
                } catch (error) {
                    this.state.message = `Error: ${error.message}`;
                    this.state.uploading = false;
                    this.render();
                }
            }
            applyFilters() {
                let filtered = this.state.inventory;
                Object.keys(this.state.filters).forEach(key => {
                    if (!this.state.filters[key]) return;
                    if (key === 'priceMin') filtered = filtered.filter(i => i.lowestPrice >= parseFloat(this.state.filters[key]));
                    else if (key === 'priceMax') filtered = filtered.filter(i => i.highestPrice <= parseFloat(this.state.filters[key]));
                    else if (key === 'furnished') {
                        if (this.state.filters[key] === 'furnished') filtered = filtered.filter(i => i.furnished);
                        else if (this.state.filters[key] === 'non-furnished') filtered = filtered.filter(i => i.nonFurnished);
                    }
                    else filtered = filtered.filter(i => (i[key] || '').toLowerCase().includes(this.state.filters[key].toLowerCase()));
                });
                this.state.filteredInventory = filtered;
            }
            downloadCSV() {
                const headers = ['Developer', 'Project', 'Location', 'Status', 'Unit Type', 'Bedrooms', 'Price Range', 'Area', 'Handover', 'Avail'];
                if (this.state.showCommission) headers.push('Commission %');
                const rows = this.state.filteredInventory.map(u => [u.developer || '', u.project || '', u.location || '', u.status || '', u.unitType || '', u.bedrooms || '', `${(u.lowestPrice/1e6).toFixed(2)}M-${(u.highestPrice/1e6).toFixed(2)}M`, `${u.lowestArea}-${u.highestArea}`, u.handoverTimeline || '', u.availability ? '✓' : '✗', ...(this.state.showCommission ? [(u.commission || 0) * 100] : [])]);
                const csv = [headers, ...rows].map(r => r.map(c => `"${c}"`).join(',')).join('\n');
                const blob = new Blob([csv], { type: 'text/csv' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `inventory-${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            }
            resetFilters() {
                this.state.filters = { developer: '', location: '', priceMin: '', priceMax: '', unitType: '', status: '', bedrooms: '', furnished: '' };
                this.applyFilters();
                this.render();
            }
            render() {
                const app = document.getElementById('app');
                if (!this.state.userRole) {
                    app.innerHTML = `<div class="min-h-screen bg-blue-600 flex items-center justify-center"><div class="bg-white p-8 rounded-lg shadow-lg w-96"><h1 class="text-3xl font-bold text-center mb-2">Real Estate Inventory</h1><p class="text-center text-gray-600 mb-6">UAE Developer Inventory System</p><div class="mb-6"><label class="block font-semibold mb-3">Login as:</label><label class="flex items-center mb-2"><input type="radio" id="adminRadio" name="role" class="mr-2"> Admin (Full Access)</label><label class="flex items-center"><input type="radio" id="teamRadio" name="role" class="mr-2"> Team Member</label></div>${this.state.message ? `<div class="mb-4 p-3 bg-red-100 text-red-700 rounded">${this.state.message}</div>` : ''}<button id="loginBtn" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Login</button><p class="text-center text-gray-600 text-sm mt-6"><strong>Admin:</strong> admin123<br/><strong>Team:</strong> team123</p></div></div>`;
                    document.getElementById('adminRadio').addEventListener('change', () => { this.state.password = 'admin123'; this.render(); });
                    document.getElementById('teamRadio').addEventListener('change', () => { this.state.password = 'team123'; this.render(); });
                    document.getElementById('loginBtn').addEventListener('click', () => this.handleLogin(this.state.password));
                } else {
                    app.innerHTML = `<div class="min-h-screen bg-gray-100"><header class="bg-blue-600 text-white p-4"><div class="max-w-7xl mx-auto flex justify-between"><div><h1 class="text-2xl font-bold">Real Estate Inventory System</h1></div><div class="flex gap-4">${this.state.userRole === 'admin' ? `<button id="commission-toggle" class="bg-blue-700 px-3 py-2 rounded">${this.state.showCommission ? '👁️ Hide' : '🚫 Show'} Commission</button>` : ''}<button id="logout-btn" class="bg-red-500 px-3 py-2 rounded">🚪 Logout</button></div></div></header><div class="bg-white border-b"><div class="max-w-7xl mx-auto flex"><button data-tab="upload" class="px-6 py-3 border-b-2 ${this.state.activeTab === 'upload' ? 'border-blue-600 text-blue-600' : 'border-transparent'}">📤 Upload Files</button><button data-tab="dashboard" class="px-6 py-3 border-b-2 ${this.state.activeTab === 'dashboard' ? 'border-blue-600 text-blue-600' : 'border-transparent'}">📊 Dashboard (${this.state.filteredInventory.length})</button></div></div><main class="max-w-7xl mx-auto p-6">${this.state.activeTab === 'upload' ? this.renderUpload() : this.renderDashboard()}</main></div>`;
                    document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', e => { this.state.activeTab = e.target.dataset.tab; this.render(); }));
                    document.getElementById('file-input')?.addEventListener('change', e => this.handleFileUpload(e));
                    document.getElementById('logout-btn')?.addEventListener('click', () => this.handleLogout());
                    document.getElementById('commission-toggle')?.addEventListener('click', () => { this.state.showCommission = !this.state.showCommission; this.render(); });
                    Object.keys(this.state.filters).forEach(key => {
                        document.getElementById(`filter-${key}`)?.addEventListener('input', e => { this.state.filters[key] = e.target.value; this.applyFilters(); this.render(); });
                    });
                    document.getElementById('reset-filters')?.addEventListener('click', () => this.resetFilters());
                    document.getElementById('download-csv')?.addEventListener('click', () => this.downloadCSV());
                }
            }
            renderUpload() {
                return `<div class="bg-white p-6 rounded-lg shadow"><h2 class="text-xl font-bold mb-4">📥 Upload Developer Inventory</h2>${this.state.message ? `<div class="mb-4 p-4 rounded border ${this.state.message.includes('✓') ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}">${this.state.message}</div>` : ''}<div class="border-2 border-dashed p-8 text-center rounded-lg"><p class="font-semibold mb-2">${this.state.uploading ? 'Processing...' : 'Drag & drop or click to upload'}</p><p class="text-gray-500 text-sm mb-4">Excel, PDF, Images supported</p><input type="file" id="file-input" accept=".xlsx,.pdf,.jpg,.png,.jpeg" class="hidden"><label for="file-input"><button type="button" ${this.state.uploading ? 'disabled' : ''} class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">${this.state.uploading ? 'Processing...' : 'Choose File'}</button></label></div></div>`;
            }
            renderDashboard() {
                return `<div class="space-y-6"><div class="bg-white p-6 rounded-lg shadow"><div class="flex justify-between mb-4"><h2 class="text-xl font-bold">🔍 Search & Filter</h2><button id="reset-filters" class="text-blue-600 text-sm">🔄 Reset</button></div><div class="grid grid-cols-3 gap-4"><input type="text" id="filter-developer" placeholder="Developer" value="${this.state.filters.developer}" class="border rounded px-3 py-2"><input type="text" id="filter-location" placeholder="Location" value="${this.state.filters.location}" class="border rounded px-3 py-2"><input type="number" id="filter-priceMin" placeholder="Min Price" value="${this.state.filters.priceMin}" class="border rounded px-3 py-2"><input type="number" id="filter-priceMax" placeholder="Max Price" value="${this.state.filters.priceMax}" class="border rounded px-3 py-2"><input type="text" id="filter-unitType" placeholder="Unit Type" value="${this.state.filters.unitType}" class="border rounded px-3 py-2"><select id="filter-status" class="border rounded px-3 py-2"><option value="">All Status</option><option value="Ready">Ready</option><option value="Under Construction">Under Construction</option></select><select id="filter-bedrooms" class="border rounded px-3 py-2"><option value="">All Bedrooms</option><option value="1BR">1BR</option><option value="2BR">2BR</option><option value="3BR">3BR</option></select><select id="filter-furnished" class="border rounded px-3 py-2"><option value="">All</option><option value="furnished">Furnished</option><option value="non-furnished">Non-Furnished</option></select></div></div><div class="flex justify-between"><h3 class="font-semibold">Results: ${this.state.filteredInventory.length} units</h3><button id="download-csv" class="bg-green-600 text-white px-4 py-2 rounded">⬇️ Download CSV</button></div>${this.state.filteredInventory.length > 0 ? `<div class="bg-white rounded-lg shadow overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-100"><tr><th class="px-4 py-2 text-left">Developer</th><th class="px-4 py-2 text-left">Project</th><th class="px-4 py-2 text-left">Location</th><th class="px-4 py-2 text-left">Unit Type</th><th class="px-4 py-2 text-left">Price</th><th class="px-4 py-2 text-left">Status</th><th class="px-4 py-2 text-left">Avail</th>${this.state.showCommission ? '<th class="px-4 py-2 text-left">Commission</th>' : ''}</tr></thead><tbody>${this.state.filteredInventory.map(u => `<tr class="border-b"><td class="px-4 py-2">${u.developer || '-'}</td><td class="px-4 py-2">${u.project || '-'}</td><td class="px-4 py-2">${u.location || '-'}</td><td class="px-4 py-2">${u.unitType || '-'}</td><td class="px-4 py-2">${u.lowestPrice ? `${(u.lowestPrice/1e6).toFixed(2)}M` : '-'}</td><td class="px-4 py-2"><span class="px-2 py-1 rounded text-xs ${u.status?.includes('Ready') ? 'bg-green-100' : 'bg-yellow-100'}">${u.status || '-'}</span></td><td class="px-4 py-2">${u.availability ? '✓' : '✗'}</td>${this.state.showCommission ? `<td class="px-4 py-2">${(u.commission || 0) * 100}%</td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<div class="bg-white p-12 text-center rounded-lg"><p class="text-gray-500">No inventory yet. Upload files to get started.</p></div>'}</div>`;
            }
        }
        window.addEventListener('DOMContentLoaded', () => new RealEstateApp());
    </script>
</body>
</html>
